name: Update GitHub Profile

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest

    steps:

      # -------------------------------
      # Checkout repository
      # -------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # -------------------------------
      # Generate GitHub Stats
      # -------------------------------
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------
      # Generate Contribution Activity
      # -------------------------------
      - name: Generate Contribution Activity
        uses: lowlighter/metrics@latest
        with:
          filename: profile/activity.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 1

      # -------------------------------
      # Generate GitHub Achievements
      # -------------------------------
      - name: Generate GitHub Trophies
        uses: lowlighter/metrics@latest
        with:
          filename: profile/trophies.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: detailed

      # -------------------------------
      # Save generated SVG files
      # -------------------------------
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git diff --cached --quiet || git commit -m "Update GitHub profile stats"

          git push
